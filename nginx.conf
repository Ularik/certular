server {
    listen 80;
    server_name 127.0.0.1;
    # server_name cert.gov.kg;

    location / {
        proxy_pass http://django_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Раздача статики Django
    location /static/ {
        alias /usr/www/static/;
    }

    location /media/ {
        # Можно продублировать или увеличить лимит точечно здесь для медиа-файлов
        client_max_body_size 100M;
        alias /usr/www/media/;

        expires 30d;
        add_header Cache-Control "public, immutable";

        gzip_static on;   # если рядом лежат .gz версии файлов
        gzip on;
        gzip_types image/svg+xml;  # для растровых (jpg/png/webp) gzip почти бесполезен, они уже сжаты
    }

}
