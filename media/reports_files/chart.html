<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Линейный график</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        canvas {
            max-width: 600px;
            margin: 20px auto;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="myChart" width="600px" height="600px"></canvas>
    <div class="organs">

    </div>
    <script>
        const list_items = {
            2: [[1, 2, 20], [3, 1, 10], [4, 1, 10], [1, 2, 20], [3, 1, 10], [4, 1, 10]],
            3: [[1, 1, 20], [3, 2, 10], [4, 1, 10], [4, 2, 10], [1, 2, 20], [3, 1, 10], [4, 1, 10]]
        }
        const months = Object.keys(list_items)
        const org_list = {}

        const orgDiv = document.querySelector('.organs')

        let index = 0
        for (const month of months) {
            console.log('month ' + month)
            console.log(list_items[month])
            for (const report of list_items[month]) {
            
                if (!org_list[report[1]]) {
                    org_list[report[1]] = {
                        allReports: [],
                        doneReports: []
                    }
                }

                if (org_list[report[1]].allReports.length !== index + 1) {
                    org_list[report[1]].allReports.push(0)
                    org_list[report[1]].doneReports.push(0)
                }

                org_list[report[1]].allReports[index] += report[2]
                if (report[0] === 4) {
                    org_list[report[1]].doneReports[index] += report[2]
                }
            }
            index++
        }
        console.log(org_list)


        for (const org_name of Object.keys(org_list)) {
            const btn = document.createElement('button')
            btn.innerText = org_name

            orgDiv.appendChild(btn)

            btn.addEventListener('click', () => changeChart(org_name))
        }

        let main_org = Object.keys(org_list)[0]
        const chart = org_list[main_org]
        const data1 = chart.allReports
        const data2 = chart.doneReports

        const ctx = document.getElementById('myChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: months,
                datasets: [
                    {
                        label: 'Отчеты (шт)',
                        data: data1,
                        borderColor: 'blue',
                        backgroundColor: 'rgba(0, 0, 255, 0.2)',
                        fill: true,
                        tension: 0.4
                    },
                    {
                        label: 'Расходы ($K)',
                        data: data2,
                        borderColor: 'red',
                        backgroundColor: 'rgba(255, 0, 0, 0.2)',
                        fill: true,
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        function changeChart(org) {
            main_org = org;
            
            // Обновляем данные графика
            myChart.data.datasets[0].data = org_list[main_org].allReports;
            myChart.data.datasets[1].data = org_list[main_org].doneReports;
            
            myChart.update(); // Перерисовываем график
        }
    </script>
</body>
</html>
