{% extends 'base.html' %}
{% load static %}
{% load i18n %}
{% block meta_page %}
    <meta name="robots" content="noindex">
{% endblock meta_page %}
{% block title %}{% trans 'Отчёты' %}{% endblock title %}

{% block content %}
<section class="reports">
    <div class="my-container">
        <div class="reports-block">
            <div class="reports-block-header">
                <p class="reports-title">{% trans 'Отчёты' %}</p>
            </div>

            <div class="reports-block-inner-table" id="reportsContainer">
                <div class="btns-pannel">
                    <button id="download-btn" class="reports-btn">Скачать zip</button>
                    <button id="sort-btn" class="reports-btn">Сортировать</button>
                    <button id="zeroReports-btn" class="reports-btn">Не выполненные</button>
                    <div id="download-zip-loader" class="loader-wrapper">
                        <div class="loader"></div>
                    </div>
                </div>
                <table class="table reports-block-table" id="reportsTable">
                    <thead>
                        <tr>
                            <th scope="col">№</th>
                            <th scope="col">Название</th>
                            <th scope="col">Организация</th>
                            <th scope="col">Пользователь</th>
                            <th scope="col">Дата</th>
                            <th scope="col">Документ</th>
                            <th scope="col">Статус</th>
                        </tr>
                    </thead>
                    <tbody id="reportsBody">
                        <!-- Сюда будет вставляться содержимое -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>
    <script src="{% static 'js/modules/reports.js' %}"></script>
</section>

{% endblock content %}
