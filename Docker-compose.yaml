version: '3.9'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_cache
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  web:
    build: .   # Указывает, что образ для Django собирается из текущей директории (.).
    container_name: django_app
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      DEBUG: "true"
    volumes:
      - .:/usr/www/   # Связывает текущую директорию (где код Django) с /usr/www/ внутри контейнера.
    ports:
      - "8000:8000"
    command: >
      sh -c "python project/manage.py migrate && \
             python project/manage.py collectstatic --noinput && \
             python project/manage.py compilemessages && \
             python project/manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
  redis_data:
