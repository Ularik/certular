version: '3.9'

services:
  redis:
    image: redis:7
    container_name: redis_cache
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  web:
    build: .   # Указывает, что образ для Django собирается из текущей директории (.).
    container_name: django_app
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      DEBUG: "true"
    volumes:
      - static_volume:/usr/www/static
      - media_volume:/usr/www/media
    command: >
      sh -c "python project/manage.py migrate && \
             python project/manage.py collectstatic --noinput && \
             python project/manage.py compilemessages && \
             python project/manage.py runserver 0.0.0.0:8000"

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/www/static
      - media_volume:/usr/www/media
    depends_on:
      - web

volumes:
  redis_data:
  static_volume:
  media_volume:
